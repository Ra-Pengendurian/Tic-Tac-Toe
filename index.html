<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Online</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        h1 { margin-bottom: 10px; font-size: 1.5rem; }
        .room-input { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; font-size: 1rem; width: 150px; text-align: center; }
        .board { display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 5px; }
        .cell { background-color: #333; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; border-radius: 10px; transition: background 0.2s; }
        .cell:hover { background-color: #444; }
        .cell.x { color: #ff4757; }
        .cell.o { color: #1e90ff; }
        .status { margin-top: 20px; font-size: 1.1rem; font-weight: bold; text-align: center; }
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; color: white; }
        .btn-primary { background-color: #1e90ff; }
        .btn-primary:hover { background-color: #0066cc; }
        .btn-danger { background-color: #ff4757; }
        .btn-danger:hover { background-color: #cc0000; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe Online</h1>
    <div class="room-input" id="roomInput">
        <input type="text" id="roomId" placeholder="Kode Room" maxlength="6">
        <button class="btn-primary" onclick="joinRoom()">Masuk</button>
    </div>
    <div class="board hidden" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div class="status hidden" id="status"></div>
    <div class="button-group hidden" id="buttonGroup">
        <button class="btn-primary" id="restartBtn" onclick="restartGame()">Main Lagi</button>
        <button class="btn-danger" id="leaveBtn" onclick="leaveRoom()">Keluar</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKtBWjahaI6VEYqbgWB6sqUBwcOBeBlcI",
            authDomain: "tic-tac-toe-e2a08.firebaseapp.com",
            databaseURL: "https://tic-tac-toe-e2a08-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tic-tac-toe-e2a08",
            storageBucket: "tic-tac-toe-e2a08.firebasestorage.app",
            messagingSenderId: "452204906054",
            appId: "1:452204906054:web:5a27c344abebb752fb6c47",
            measurementId: "G-DTB69KLFQ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let roomId = "";
        let mySymbol = "X"; 
        let isMyTurn = false;
        let gameActive = false;

        const roomInputDiv = document.getElementById("roomInput");
        const boardDiv = document.getElementById("board");
        const statusDisplay = document.getElementById("status");
        const buttonGroup = document.getElementById("buttonGroup");
        const cells = document.querySelectorAll(".cell");

        window.joinRoom = function() {
            roomId = document.getElementById("roomId").value.trim().toUpperCase();
            if (roomId === "") return alert("Masukkan kode room!");

            roomInputDiv.classList.add("hidden");
            boardDiv.classList.remove("hidden");
            statusDisplay.classList.remove("hidden");
            buttonGroup.classList.remove("hidden");
            gameActive = true;

            const roomRef = ref(db, 'rooms/' + roomId);
            
            // Auto-Cleanup: Jika koneksi terputus, hapus room ini dari database
            onDisconnect(roomRef).remove();

            // Cek apakah room sudah ada
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.pemainX && data.pemainO) {
                        alert("Room ini sudah penuh!");
                        leaveRoom();
                        return;
                    }
                    if (!data.pemainX) {
                        mySymbol = "X";
                        set(ref(db, 'rooms/' + roomId + '/pemainX'), true);
                    } else if (!data.pemainO) {
                        mySymbol = "O";
                        set(ref(db, 'rooms/' + roomId + '/pemainO'), true);
                    }
                    updateBoard(data.papan);
                    checkGameStatus(data);
                } else {
                    mySymbol = "X";
                    set(roomRef, {
                        papan: ["", "", "", "", "", "", "", "", ""],
                        giliran: "X",
                        pemainX: true,
                        pemainO: false
                    });
                }
            }, { onlyOnce: true });

            listenToRoom();
        };

        function listenToRoom() {
            const roomRef = ref(db, 'rooms/' + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    updateBoard(data.papan);
                    checkGameStatus(data);
                }
            });
        }

        function updateBoard(papan) {
            cells.forEach((cell, index) => {
                cell.textContent = papan[index];
                cell.classList.remove("x", "o");
                if (papan[index] === "X") cell.classList.add("x");
                if (papan[index] === "O") cell.classList.add("o");
            });
        }

        function checkGameStatus(data) {
            const papan = data.papan;
            const giliran = data.giliran;
            
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            let roundWon = false;
            let pemenang = "";

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (papan[a] && papan[a] === papan[b] && papan[a] === papan[c]) {
                    roundWon = true;
                    pemenang = papan[a];
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.textContent = `Pemain ${pemenang} Menang!`;
                gameActive = false;
                return;
            }

            if (!papan.includes("")) {
                statusDisplay.textContent = "Seri!";
                gameActive = false;
                return;
            }

            gameActive = true;
            isMyTurn = (giliran === mySymbol);
            statusDisplay.textContent = isMyTurn ? `Giliran Kamu (${mySymbol})` : `Giliran Lawan (${giliran})`;
        }

        function handleCellClick(e) {
            if (!isMyTurn || !gameActive) return;

            const cell = e.target;
            const index = parseInt(cell.getAttribute("data-index"));

            const roomRef = ref(db, 'rooms/' + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.papan[index] === "") {
                    const newPapan = [...data.papan];
                    newPapan[index] = mySymbol;
                    const nextGiliran = mySymbol === "X" ? "O" : "X";
                    
                    set(roomRef, {
                        papan: newPapan,
                        giliran: nextGiliran,
                        pemainX: data.pemainX,
                        pemainO: data.pemainO
                    });
                }
            }, { onlyOnce: true });
        }

        window.restartGame = function() {
            const roomRef = ref(db, 'rooms/' + roomId);
            set(roomRef, {
                papan: ["", "", "", "", "", "", "", "", ""],
                giliran: "X",
                pemainX: true,
                pemainO: true // Biarkan true agar tidak dianggap keluar
            });
        };

        window.leaveRoom = function() {
            const roomRef = ref(db, 'rooms/' + roomId);
            remove(roomRef).then(() => {
                // Reset tampilan ke awal
                roomInputDiv.classList.remove("hidden");
                boardDiv.classList.add("hidden");
                statusDisplay.classList.add("hidden");
                buttonGroup.classList.add("hidden");
                document.getElementById("roomId").value = "";
            });
        };

        cells.forEach(cell => cell.addEventListener("click", handleCellClick));
    </script>
</body>
</html>
